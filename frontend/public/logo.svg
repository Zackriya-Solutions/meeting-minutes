<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Indigo to Violet Gradient for Background Bubble -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Pink to Rose Gradient for Foreground Bubble -->
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Chat Bubble (Blue/Violet) -->
  <path d="M 165 150
           H 255
           A 35 35 0 0 1 290 185
           V 235
           A 35 35 0 0 1 255 270
           H 200
           L 150 315
           L 165 270
           A 35 35 0 0 1 130 235
           V 185
           A 35 35 0 0 1 165 150 Z"
        fill="url(#gradBlue)" />

  <!-- Right Chat Bubble (Pink/Rose) with Drop Shadow -->
  <path d="M 265 220
           H 355
           A 35 35 0 0 1 390 255
           V 305
           A 35 35 0 0 1 355 340
           L 370 385
           L 320 340
           H 265
           A 35 35 0 0 1 230 305
           V 255
           A 35 35 0 0 1 265 220 Z"
        fill="url(#gradPink)"
        filter="url(#softShadow)" />

  <!-- Typing Indicator Dots in the Right Bubble -->
  <circle cx="285" cy="280" r="7" fill="#FFFFFF" opacity="0.4" />
  <circle cx="310" cy="280" r="7" fill="#FFFFFF" opacity="0.7" />
  <circle cx="335" cy="280" r="7" fill="#FFFFFF" opacity="1.0" />

  <!-- App Name Text -->
  <text x="260" y="460" font-family="'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="#1F2937">conversation</tspan><tspan fill="url(#gradPink)">aly</tspan>
  </text>
</svg>
