[package]
name = "meetily"
version = "0.4.0"
description = "A Tauri App for meeting minutes"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/Zackriya-Solutions/meeting-minutes"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep the package name stable for Cargo/workspace compatibility, but expose a
# Memento-named executable so macOS crash reports and process lists no longer
# show the retired Meetily brand.
[[bin]]
name = "memento"
path = "src/main.rs"


# Hardware acceleration features for whisper-rs
# Cross-platform GPU acceleration with smart defaults
#
# BUILD INSTRUCTIONS:
# ===================
# macOS:     cargo build --release              (Metal GPU auto-enabledon)
#
# Windows:   cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features vulkan  (AMD/Intel GPU)
#
# Linux:     cargo build --release              (CPU with OpenBLAS)
#            cargo build --release --features cuda    (NVIDIA GPU)
#            cargo build --release --features hipblas (AMD GPU with ROCm)
#            cargo build --release --features vulkan  (Other GPUs)
#
# QUICK START: Use the helper scripts!
#   ./build-gpu.sh (Unix/macOS)
#   .\build-gpu.ps1 (Windows PowerShell)
#
[features]
default = ["platform-default"]  # Automatically enables best backend per platform

# Platform-appropriate defaults - see target-specific dependencies below
platform-default = []

# Manual GPU acceleration options (for power users to override defaults)
metal = ["whisper-rs/metal"]       # macOS: Apple Metal GPU (Auto-enabled on macOS)
coreml = ["whisper-rs/coreml"]     # macOS: Apple CoreML acceleration
cuda = ["whisper-rs/cuda"]         # Windows/Linux: NVIDIA CUDA GPU
vulkan = ["whisper-rs/vulkan"]     # Windows/Linux: AMD/Intel Vulkan GPU
hipblas = ["whisper-rs/hipblas"]   # Linux: AMD ROCm HIP

# CPU optimizations (fallback for systems without GPU)
openblas = ["whisper-rs/openblas"] # Optimized BLAS (Auto-enabled on Windows/Linux)
openmp = ["whisper-rs/openmp"]     # OpenMP parallel processing

[lints.rust]
# `objc` 0.2's `msg_send!`/`class!` expand to a `cfg(feature = "cargo-clippy")` check, a
# feature this crate doesn't declare — so the lint fires at every CoreML call site in
# `gigaam_engine::coreml`. A local `#[allow]` can't reach it (the span belongs to the macro's
# crate), so the value is declared expected here instead. The lint stays on otherwise.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
which = "6.0.1"
zip = "2.2"           # ZIP extraction (Windows, macOS)
tar = "0.4"           # TAR extraction (Linux)
xz2 = "0.1"           # XZ decompression (Linux)


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
posthog-rs = "0.3.7"

# Cross-platform audio capture
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive"] }

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction
nnnoiseless = "0.5"

# Speech recognition and async utilities
# NOTE: whisper-rs is declared in platform-specific sections below (macOS/Windows/Linux)
# to ensure correct GPU features are enabled per platform
futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# Parakeet (ONNX-based fast transcription) dependencies
ort = { version = "2.0.0-rc.10" }  # ONNX Runtime for Parakeet models
thiserror = "2.0.16"                # Error handling for Parakeet

# SaluteSpeech (Sber) cloud ASR uses the synchronous HTTP recognize API via the
# existing `reqwest` client — no extra dependencies required.

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"

# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"
# keyring 3.x ships NO credential store by default: with no store feature selected it
# resolves to the in-memory `mock` backend (see its `src/lib.rs`:
# `#[cfg(all(target_os = "macos", not(feature = "apple-native")))] pub use mock as default;`).
# Nothing persists, every `Entry` starts empty, and the gateway install token is
# re-minted on every call. The real store is selected per target below.
keyring = "3.6"


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rand = "0.8.5"
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"
whatlang = "0.16.4"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", rev = "b0f48a514235d1278d860f4a0af66aa9d6e1618d" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono", "json"] }

# V1 knowledge base: local vector search via sqlite-vec (PLAN.md Phase 0/1).
# The extension is statically linked and registered via sqlite3_auto_extension
# (see src/vector/mod.rs), so no per-OS binary needs to be shipped.
# IMPORTANT: `libsqlite3-sys` MUST resolve to the SAME version sqlx-sqlite links,
# otherwise the amalgamation is compiled twice (duplicate-symbol link error) or the
# auto-extension registers on a different SQLite than sqlx uses. sqlx 0.8 pins
# libsqlite3-sys 0.30.x; keep this in sync if sqlx is bumped. Features unify with
# sqlx's (bundled), so we only declare the version here.
sqlite-vec = "0.1"
libsqlite3-sys = "0.30"

# Fuzzy string matching for entity resolution (PLAN.md Phase 3, Jaro-Winkler).
strsim = "0.10.0"

# Agglomerative hierarchical clustering for speaker diarization (PLAN.md Phase 2).
# Pure-Rust, MIT; used to cluster per-turn speaker embeddings into global speakers.
kodama = "0.3"

# HuggingFace tokenizer for the local embedder (loads tokenizer.json). default-features
# off to avoid the progressbar/esaxx extras; `onig` supplies the regex backend.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.3.0"
tauri-plugin-process = "2.3.0"

# Desktop-only single instance guard
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.3.7"

# macOS-specific dependencies with Metal GPU acceleration
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
once_cell = "1.17.1"
objc = "0.2.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
anyhow = "1.0"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
core-graphics = "0.23"
# Native macOS Accessibility (AXUIElement) traversal for the local Outlook
# calendar connector. This reads the visible Outlook UI only after explicit
# user approval in Privacy & Security → Accessibility.
core-foundation-sys = "0.8"
# Keychain Services, so the install token actually survives a restart.
keyring = { version = "3.6", features = ["apple-native"] }
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
# Unpacks the CoreML/Neural Engine encoder archive at download time (see
# `gigaam_engine::commands::extract_mlpackage`). Same version the build script uses.
zip = "2.2"
dasp = "0.11.0"
futures-channel = "0.3.31"

# PERFORMANCE: Enable Metal GPU + CoreML acceleration automatically on macOS
# CoreML provides additional acceleration for Apple Silicon chips
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }

# Windows-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"
# Windows Credential Manager.
keyring = { version = "3.6", features = ["windows-native"] }
# Local classic-Outlook calendar access through the Outlook Object Model
# (COM/MAPI). No Microsoft Graph or external calendar service is involved.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# Linux-specific dependencies
# Default: CPU-only build (no BLAS)
# Users can enable features manually:
#   --features cuda     (NVIDIA GPUs)
#   --features vulkan   (AMD/Intel GPUs)
#   --features hipblas  (AMD ROCm)
#   --features openblas (OpenBLAS optimization, requires BLAS_INCLUDE_DIRS)
[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }
futures-channel = "0.3.31"
# Kernel keyutils rather than the Secret Service: it needs no D-Bus at build or run
# time, so the documented Linux prerequisites (cmake, llvm, libomp) stay as they are.
# The trade-off is session-scoped storage — the token is re-minted after a reboot,
# which is still strictly better than the mock store's re-mint on every call.
keyring = { version = "3.6", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
futures = "0.3.31"
tracing-subscriber = "0.3.16"
