# VALUEOS: CI for OUR automated tests (never upstream's). Runs the ValueOS branded-shell
# test suite on every push. Distinctly named so it never collides with upstream workflows.
# Standing rule for this fork: every VA feature ships with tests for our code, run here.

name: "ValueOS Agent — Tests"

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: valueos-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-tests:
    name: ValueOS branded-shell tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valueos/shell-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: valueos/shell-tests/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Run ValueOS shell tests (upstream download mocked)
        run: npm test
