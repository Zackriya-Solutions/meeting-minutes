# VALUEOS: TEMPORARY macOS-only test build.
# Purpose: kick off an async cloud build of the Mac app straight from this feature branch
# — before the real pipeline (valueos-build.yml) lives on `main` — just to confirm the app
# compiles and produces an installer. It builds macOS ONLY (no Windows), so it's cheap and
# quiet. Safe to DELETE once the main pipeline is running from `main`.
#
# To launch it, push a tag matching `macos-test*` (e.g. `git tag macos-test-1 &&
# git push origin macos-test-1`). Tag-based so it fires regardless of the branch name.
# New file — no upstream file is touched. Mirrors the macOS leg of valueos-build.yml.

name: "ValueOS Agent — macOS test build"

on:
  # Launch on demand by pushing a tag like `macos-test-1` (branch-name independent).
  push:
    tags:
      - "macos-test*"
  # Also runnable from the Actions tab, but only once this file reaches the default branch.
  workflow_dispatch:

concurrency:
  group: valueos-macos-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (Apple Silicon) — test
    runs-on: macos-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "Application version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + build (workspace target dir)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: aarch64-apple-darwin

      - name: Show toolchain versions
        shell: bash
        run: |
          echo "node:  $(node --version)"
          echo "pnpm:  $(pnpm --version)"
          echo "rustc: $(rustc --version)"
          echo "cmake: $(cmake --version | head -1 || echo 'cmake not found')"

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          pnpm install

      - name: Build llama-helper sidecar
        shell: bash
        run: |
          # Sidecar must exist (target-triple name) before `tauri build` — it's an externalBin.
          cargo build --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          echo "Sidecar binaries present:"
          ls -la frontend/src-tauri/binaries/

      - name: Build Tauri app (unsigned dev build)
        id: build
        shell: bash
        working-directory: frontend
        run: |
          # macOS ad-hoc signs (signingIdentity "-"); no Apple secrets needed. The --config
          # file disables updater-artifact signing so no TAURI_SIGNING_PRIVATE_KEY is required.
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > valueos-ci.config.json
          pnpm exec tauri build --target aarch64-apple-darwin --config valueos-ci.config.json

      - name: List and verify installer
        if: success()
        shell: bash
        run: |
          BUNDLE="target/aarch64-apple-darwin/release/bundle"
          echo "Installers under ${BUNDLE}:"
          find "${BUNDLE}" -type f \( -name "*.dmg" -o -name "*.app" \) 2>/dev/null || true
          if [ -z "$(find "${BUNDLE}/dmg" -name '*.dmg' 2>/dev/null)" ]; then
            echo "::error::No .dmg produced under ${BUNDLE}/dmg"
            exit 1
          fi

      - name: Upload macOS installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: valueos-agent-macos-test
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary to run
        if: always()
        shell: bash
        run: |
          OUTCOME="${{ steps.build.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          {
            echo "## 🍎 macOS test build — ValueOS Agent"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Result | ${STATUS} |"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Target | \`aarch64-apple-darwin\` (Apple Silicon) |"
            echo "| Artifact | \`valueos-agent-macos-test\` |"
            echo "| Signing | Unsigned dev build (ad-hoc; no notarization) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            echo "Download the installer from the **Artifacts** section of this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ Build did not complete — check the step logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
