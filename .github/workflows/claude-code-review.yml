name: OpenRouter Code Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: memento-code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      vars.MEMENTO_CLAUDE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      MEMENTO_REVIEW_BASE_URL: http://127.0.0.1:14000
      MEMENTO_REVIEW_MODEL: memento-review-sonnet-5

    steps:
      # pull_request_target may access secrets, so execute only the trusted base
      # revision. The reviewer downloads the PR diff as untrusted API data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Open encrypted tunnel to the review gateway
        env:
          MEMENTO_REVIEW_SSH_KEY: ${{ secrets.MEMENTO_REVIEW_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/memento-review-tunnel-key"
          control_socket="$RUNNER_TEMP/memento-review-ssh-control"

          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$MEMENTO_REVIEW_SSH_KEY" > "$key_file"

          ssh -fNT -M -S "$control_socket" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ExitOnForwardFailure=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/memento-review-known-hosts" \
            -i "$key_file" \
            -L 127.0.0.1:14000:127.0.0.1:4000 \
            aiwa-tunnel@104.168.54.196

          shred -u "$key_file"

          for attempt in {1..10}; do
            if curl --fail --silent --show-error --max-time 3 \
              http://127.0.0.1:14000/health/liveliness >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Review gateway did not become healthy through the SSH tunnel" >&2
          exit 1

      - name: Review pull request through OpenRouter
        env:
          MEMENTO_REVIEW_LITELLM_KEY: ${{ secrets.MEMENTO_REVIEW_LITELLM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/memento_pr_review.py

      - name: Close tunnel and remove credentials
        if: always()
        run: |
          control_socket="$RUNNER_TEMP/memento-review-ssh-control"
          key_file="$RUNNER_TEMP/memento-review-tunnel-key"
          ssh -S "$control_socket" -O exit aiwa-tunnel@104.168.54.196 2>/dev/null || true
          if [[ -f "$key_file" ]]; then
            shred -u "$key_file"
          fi
