# ValueOS Agent — CI. Build + test.
#   - push to any branch + pull requests → build & test on macOS only (fast feedback)
#   - main → build & test on the full matrix (ubuntu + macOS + windows)
# The version/publish flow lives in publish.yml (manual, with a confirmation gate). See valueos/CI.md.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  # Pick the OS matrix from the ref: main → all three; anything else → macOS only.
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & test (${{ matrix.os }})
    needs: set-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Per-OS Rust target + sidecar paths (matrix is just the OS name).
      - name: Build vars
        id: v
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)
              echo "target=aarch64-apple-darwin"
              echo "feat=--features metal"
              echo "src=target/release/llama-helper"
              echo "dst=frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin"
              echo "platform=macos"
              echo "bundles=" ;;
            Windows)
              echo "target=x86_64-pc-windows-msvc"
              echo "feat="
              echo "src=target/release/llama-helper.exe"
              echo "dst=frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"
              echo "platform=windows"
              echo "bundles=" ;;
            Linux)
              echo "target=x86_64-unknown-linux-gnu"
              echo "feat="
              echo "src=target/release/llama-helper"
              echo "dst=frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu"
              echo "platform=linux"
              echo "bundles=--bundles deb,appimage" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libopenblas-dev \
            libx11-dev libxtst-dev libxrandr-dev \
            fuse libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.v.outputs.target }}
      - name: Cache cargo registry + build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ steps.v.outputs.target }}

      - name: Install frontend dependencies
        shell: bash
        run: cd frontend && pnpm install --no-frozen-lockfile

      - name: Build llama-helper sidecar
        shell: bash
        run: |
          cargo build --release -p llama-helper ${{ steps.v.outputs.feat }}
          mkdir -p frontend/src-tauri/binaries
          cp "${{ steps.v.outputs.src }}" "${{ steps.v.outputs.dst }}"

      - name: Apply ValueOS branding (icons)
        shell: bash
        run: bash valueos/branding/apply-branding.sh

      # BUILD — real Tauri build, WITH installer packaging so every push produces a
      # downloadable installer artifact (macos .dmg, windows .msi/.exe, linux .deb/.AppImage).
      - name: Build
        shell: bash
        working-directory: frontend
        run: |
          export NEXT_PUBLIC_VALUEOS_BUILD="${GITHUB_SHA:0:7}"
          export NEXT_PUBLIC_VALUEOS_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export NEXT_PUBLIC_VALUEOS_REAL="on"
          node ../valueos/branding/make-ci-config.js valueos-ci.config.json
          pnpm exec tauri build --target ${{ steps.v.outputs.target }} ${{ steps.v.outputs.bundles }} --config valueos-ci.config.json

      # The repo root is a Cargo workspace, so bundles land in the REPO-ROOT target/, not
      # frontend/src-tauri/target/. Fail loudly if packaging produced nothing.
      - name: Verify installers
        shell: bash
        run: |
          dir="target/${{ steps.v.outputs.target }}/release/bundle"
          echo "Looking for installers in $dir"
          if [ ! -d "$dir" ] || [ -z "$(find "$dir" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) 2>/dev/null)" ]; then
            echo "::error::No installer produced in $dir"; ls -R "$dir" 2>/dev/null || true; exit 1
          fi
          find "$dir" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: valueos-agent-${{ steps.v.outputs.platform }}
          path: target/${{ steps.v.outputs.target }}/release/bundle
          if-no-files-found: error

      # TEST — our vitest suite (mocks the engine/HTTP layer). Runs on every push/PR.
      - name: Test (ValueOS shell tests)
        shell: bash
        working-directory: valueos/shell-tests
        run: |
          npm ci
          npm test
