# VALUEOS: main CI for ValueOS Agent (fork of Meetily).
#   - push to main, push a v* tag, or manual run:
#       STAGE 1  run ALL ValueOS tests (must pass — the build `needs:` it)
#       STAGE 2  build + package on Linux + macOS + Windows (fail-fast: false)
# Distinctly named so it never collides with any upstream workflow. See valueos/CI.md.
name: "ValueOS Agent — Main (tests + Linux/macOS/Windows)"

on:
  push:
    branches:
      - main
  workflow_dispatch:
# Note: v* tags are handled by publish-agent.yml (build → S3 → register the release), not here.

concurrency:
  group: valueos-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 — tests for OUR code only (the shell-tests vitest project). Mandatory:
  # the build stage `needs:` this and only runs if it succeeds.
  # ---------------------------------------------------------------------------
  test:
    name: ValueOS tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valueos/shell-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: valueos/shell-tests/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Run ValueOS shell tests (OUR code only)
        run: npm test

  # ---------------------------------------------------------------------------
  # STAGE 2 — build + package on all supported platforms. Add a platform by
  # appending one entry to the matrix (fail-fast: false, so one OS failing does
  # not stop the others).
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: [test]
    if: ${{ needs.test.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: "macOS (Apple Silicon)"
            target: aarch64-apple-darwin
            artifact: valueos-agent-macos
            sidecar_features: "--features metal"
            sidecar_src: target/release/llama-helper
            sidecar_dst: frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
            bundle_args: ""
          - os: windows-latest
            label: "Windows (x64)"
            target: x86_64-pc-windows-msvc
            artifact: valueos-agent-windows
            sidecar_features: ""
            sidecar_src: target/release/llama-helper.exe
            sidecar_dst: frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe
            bundle_args: ""
          - os: ubuntu-22.04
            label: "Linux (x64)"
            target: x86_64-unknown-linux-gnu
            artifact: valueos-agent-linux
            sidecar_features: ""
            sidecar_src: target/release/llama-helper
            sidecar_dst: frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
            bundle_args: "--bundles deb,appimage"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read app version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # Tauri v2 + webkitgtk 4.1 runtime/dev libs, tray, rsvg, patchelf, ALSA, OpenBLAS
          # (llama-helper), X11 libs, and FUSE for AppImage packaging.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libopenblas-dev \
            libx11-dev libxtst-dev libxrandr-dev fuse libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # matches frontend/pnpm-lock.yaml (lockfileVersion 9.0)
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build (workspace target dir)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile

      - name: Build llama-helper sidecar
        shell: bash
        run: |
          cargo build --release -p llama-helper ${{ matrix.sidecar_features }}
          mkdir -p frontend/src-tauri/binaries
          cp "${{ matrix.sidecar_src }}" "${{ matrix.sidecar_dst }}"
          ls -la frontend/src-tauri/binaries/

      - name: Apply ValueOS branding (icons)
        shell: bash
        run: bash valueos/branding/apply-branding.sh

      - name: Build Tauri app (unsigned dev build)
        id: build
        shell: bash
        working-directory: frontend
        run: |
          export NEXT_PUBLIC_VALUEOS_BUILD="${GITHUB_SHA:0:7}"
          export NEXT_PUBLIC_VALUEOS_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export NEXT_PUBLIC_VALUEOS_REAL="on"
          echo "Stamping build: ${NEXT_PUBLIC_VALUEOS_BUILD} @ ${NEXT_PUBLIC_VALUEOS_BUILD_TIME}"
          node ../valueos/branding/make-ci-config.js valueos-ci.config.json
          pnpm exec tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }} --config valueos-ci.config.json

      - name: List and verify produced installers
        if: success()
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          echo "Installers under ${BUNDLE}:"
          find "${BUNDLE}" -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null || true
          if [ -z "$(find "${BUNDLE}" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) 2>/dev/null)" ]; then
            echo "::error::No installer found under ${BUNDLE}"
            exit 1
          fi

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          OUTCOME="${{ steps.build.outcome }}"
          [ "$OUTCOME" = "success" ] && STATUS="✅ Success" || STATUS="❌ Failed"
          {
            echo "## ${{ matrix.label }} — ValueOS Agent build"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Platform | ${{ matrix.label }} (\`${{ matrix.os }}\`) |"
            echo "| Result | ${STATUS} |"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Target | \`${{ matrix.target }}\` |"
            echo "| Artifact | \`${{ matrix.artifact }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            {
              echo "### 📦 Installers (artifact: \`${{ matrix.artifact }}\`)"
              echo '```'
              find "target/${{ matrix.target }}/release/bundle" -type f \
                \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ Build did not complete — no installers produced. Check the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
