# VALUEOS: Value Accelerator cloud build pipeline for ValueOS Agent (fork of Meetily).
# Distinctly named so it never collides with any upstream workflow under .github/workflows/.
# Builds UNSIGNED developer installers and uploads them as downloadable artifacts.
# See valueos/CI-BUILD.md for the plain-language guide.
#
# When it builds what:
#   - push to ANY branch (including main)   -> build ALL supported platforms (macOS + Windows)
#   - push a version tag  v*                -> build ALL supported platforms
#   - push the tag        macos-test        -> build macOS ONLY (fast smoke test; reuse with -f)
#   - manual "Run workflow" (once on main)  -> choose all / macos / windows
#
# A tiny "setup" job computes the platform matrix from the trigger; the "build" job then
# runs that matrix. This keeps a single source of truth for the build steps.

name: "ValueOS Agent — Build (macOS + Windows)"

on:
  push:
    branches:
      - "**" # every branch: main and any feature branch you keep
    tags:
      - "v*" # release-style version tags -> all platforms
      - "macos-test" # fixed, reusable tag -> macOS-only quick build
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build"
        type: choice
        options:
          - all
          - macos
          - windows
        default: all

concurrency:
  group: valueos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # VALUEOS: automated tests — MAIN-ONLY build gate. On a push to `main` this MUST
  # pass before the build runs, so every main build is validated by our test suite.
  # On feature branches and the `macos-test` tag it is SKIPPED (fast iteration) and
  # the build proceeds unblocked.
  # ---------------------------------------------------------------------------
  test:
    name: ValueOS tests (main gate)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valueos/shell-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: valueos/shell-tests/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Run ValueOS shell tests (OUR code only)
        run: npm test

  # ---------------------------------------------------------------------------
  # Decide which platforms to build, based on how the workflow was triggered.
  # ---------------------------------------------------------------------------
  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - name: Pick build matrix
        id: pick
        shell: bash
        run: |
          # Per-platform matrix entries (kept on one line each so they're valid JSON).
          MAC='{"os":"macos-latest","label":"macOS (Apple Silicon)","target":"aarch64-apple-darwin","artifact":"valueos-agent-macos","sidecar_features":"--features metal","sidecar_src":"target/release/llama-helper","sidecar_dst":"frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin"}'
          WIN='{"os":"windows-latest","label":"Windows (x64)","target":"x86_64-pc-windows-msvc","artifact":"valueos-agent-windows","sidecar_features":"","sidecar_src":"target/release/llama-helper.exe","sidecar_dst":"frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"}'

          PLATFORM="${{ github.event.inputs.platform }}"
          if [ "${{ github.ref }}" = "refs/tags/macos-test" ] || [ "$PLATFORM" = "macos" ]; then
            MATRIX="{\"include\":[${MAC}]}"; MODE="macOS only"
          elif [ "$PLATFORM" = "windows" ]; then
            MATRIX="{\"include\":[${WIN}]}"; MODE="Windows only"
          else
            MATRIX="{\"include\":[${MAC},${WIN}]}"; MODE="all supported platforms"
          fi
          echo "Build mode: ${MODE}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build + package on each selected platform. Resilient: one platform failing
  # does not stop the other (fail-fast: false).
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    # Wait for platform selection AND (on main only) the test gate. `always()` lets the
    # build run when `test` was SKIPPED (non-main) while still blocking it if `test` FAILED
    # on main. So main is gated by tests; feature/tag builds are not.
    needs: [setup, test]
    if: ${{ always() && needs.setup.result == 'success' && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          # .gitmodules pulls in whisper.cpp; check out submodules recursively.
          submodules: recursive

      - name: Read app version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "Application version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # matches frontend/pnpm-lock.yaml (lockfileVersion 9.0)
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build (workspace target dir)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Show toolchain versions
        shell: bash
        run: |
          echo "node:  $(node --version)"
          echo "pnpm:  $(pnpm --version)"
          echo "rustc: $(rustc --version)"
          echo "cargo: $(cargo --version)"
          echo "cmake: $(cmake --version | head -1 || echo 'cmake not found')"

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          # Upstream's committed pnpm-lock.yaml is missing the `overrides` block that
          # package.json declares, so a frozen (CI-default) install fails with
          # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. --no-frozen-lockfile lets pnpm reconcile it
          # in the CI working tree only — nothing committed, no upstream file changed.
          pnpm install --no-frozen-lockfile

      - name: Build llama-helper sidecar
        shell: bash
        run: |
          # The Tauri bundle declares binaries/llama-helper as an externalBin, so the
          # sidecar must exist (named with the target triple) BEFORE `tauri build`.
          cargo build --release -p llama-helper ${{ matrix.sidecar_features }}
          mkdir -p frontend/src-tauri/binaries
          cp "${{ matrix.sidecar_src }}" "${{ matrix.sidecar_dst }}"
          echo "Sidecar binaries present:"
          ls -la frontend/src-tauri/binaries/

      - name: Apply ValueOS branding (icons)
        shell: bash
        run: |
          # Stage the ValueOS Agent icons into src-tauri/icons in the throwaway CI working
          # tree only — never committed, no upstream file changed in git. See
          # valueos/branding/README.md.
          bash valueos/branding/apply-branding.sh

      - name: Build Tauri app (unsigned dev build)
        id: build
        shell: bash
        working-directory: frontend
        run: |
          # Direct Tauri CLI build (equivalent to `pnpm run tauri:build`, but with an
          # explicit --target for deterministic output paths). The generated overlay
          # renames the app to "ValueOS Agent" (valueos/branding/tauri.valueos.json) AND
          # disables updater-artifact generation so no TAURI_SIGNING_PRIVATE_KEY is needed
          # — see valueos/CI-BUILD.md and valueos/branding/README.md. FFmpeg is
          # auto-downloaded by build.rs; whisper/parakeet models download at RUNTIME.
          # No signing secrets are provided: macOS ad-hoc signs (signingIdentity "-")
          # and the Windows signCommand no-ops when DIGICERT_KEYPAIR_ALIAS is unset.
          #
          # The overlay is produced by a small node script (not inline JSON) and passed by
          # relative path, so nothing can be mangled by Git Bash / MSYS on windows-latest.
          #
          # VALUEOS: stamp the build identity into the frontend. beforeBuildCommand runs
          # `pnpm build` (next build) as a child of `tauri build`, so exporting these
          # NEXT_PUBLIC_* vars here makes Next inline them into the static export. The
          # landing screen then shows exactly which commit this installer came from —
          # so a stale build is instantly obvious. Works on macOS + Windows (git bash).
          export NEXT_PUBLIC_VALUEOS_BUILD="${GITHUB_SHA:0:7}"
          export NEXT_PUBLIC_VALUEOS_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # VALUEOS: force REAL transport in packaged builds so Next inlines it to a literal
          # (never a runtime process.env lookup that could fall back to mock). The mock path
          # is dev/test-only (NEXT_PUBLIC_VALUEOS_REAL=off, or services injected in tests).
          export NEXT_PUBLIC_VALUEOS_REAL="on"
          echo "Stamping build: ${NEXT_PUBLIC_VALUEOS_BUILD} @ ${NEXT_PUBLIC_VALUEOS_BUILD_TIME} (real transport)"
          node ../valueos/branding/make-ci-config.js valueos-ci.config.json
          pnpm exec tauri build --target ${{ matrix.target }} --config valueos-ci.config.json

      - name: List and verify produced installers
        if: success()
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          echo "Installers under ${BUNDLE}:"
          find "${BUNDLE}" -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) 2>/dev/null || true
          # Fail fast if the build reported success but produced no installer.
          if [ -z "$(find "${BUNDLE}" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) 2>/dev/null)" ]; then
            echo "::error::No installer (.dmg/.msi/.exe) found under ${BUNDLE}"
            exit 1
          fi

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Upload the whole bundle dir (installers + the .app); one path, cross-platform.
          path: target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary to run
        if: always()
        shell: bash
        run: |
          OUTCOME="${{ steps.build.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          {
            echo "## ${{ matrix.label }} — ValueOS Agent build"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Platform | ${{ matrix.label }} (\`${{ matrix.os }}\`) |"
            echo "| Result | ${STATUS} |"
            echo "| Build mode | ${{ needs.setup.outputs.mode }} |"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Target | \`${{ matrix.target }}\` |"
            echo "| Artifact name | \`${{ matrix.artifact }}\` |"
            echo "| Signing | Unsigned dev build (macOS ad-hoc; no notarization) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            {
              echo "### 📦 Installers (artifact: \`${{ matrix.artifact }}\`)"
              echo ""
              echo '```'
              find "target/${{ matrix.target }}/release/bundle" -type f \
                \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) 2>/dev/null || true
              echo '```'
              echo ""
              echo "Download them from the **Artifacts** section of this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ Build did not complete — no installers were produced. Check the step logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
