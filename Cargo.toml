[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper",
    "meeting-detector"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Package-specific release settings must live at the workspace root.
# LTO cannot be overridden per package, so keep the workspace default.
[profile.release.package.llama-helper]
codegen-units = 1
opt-level = "s"

# Debug builds of this workspace are dominated by DWARF, not code: whisper-rs,
# llama-cpp-sys, cidre and the Tauri tree together produced a 62 GB target/debug.
# Line tables keep backtraces pointing at file:line for our own crates, which is
# what we actually read; full DWARF for every dependency is not worth the disk.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# "*" applies to dependencies only, never to workspace members, so our code keeps
# the setting above. This also reaches the -sys crates: Cargo derives the DEBUG
# env var from the profile, and the cc/cmake builds drop -g when it is false.
[profile.dev.package."*"]
debug = false
