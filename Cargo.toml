[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# nemotron-helper needs ort 2.0.0-rc.12 (via parakeet-rs) while silero_rs pins ort to
# exactly 2.0.0-rc.10. Excluding it gives that crate its own lockfile and resolution,
# so both ONNX Runtime versions can exist side by side as separate binaries.
exclude = [
    "nemotron-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
